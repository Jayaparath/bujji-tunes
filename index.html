<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BUJJI TUNES</title>

<link rel="stylesheet"
href="style.css">

<!-- Google Fonts -->

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- Background -->

<div class="background"></div>

<div class="smoke"></div>

<!-- Effects -->

<div id="heart-container"></div>

<div id="music-container"></div>

<div id="sparkle-container"></div>

<div id="butterfly-container"></div>

<div id="screenFade"></div>
<!-- ===========================
        LOGIN CARD
=========================== -->

<div class="login-card">

    <!-- Logo -->

    <div class="logo">

        <h1>BUJJI</h1>

        <h2>TUNES</h2>

        <p>Feel Every Beat</p>

    </div>

    <!-- Login Form -->

    <form>

        <!-- Username -->

        <div class="input-box">

            <i class="fa-solid fa-user icon"></i>

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

        </div>

        <!-- Password -->

        <div class="input-box">

            <i class="fa-solid fa-lock icon"></i>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required>

            <i
                class="fa-solid fa-eye eye"
                id="loginShowPass"></i>

        </div>

        <!-- Login Button -->

        <button
            type="button"
            class="login-btn"
            id="loginBtn">

            LOGIN

        </button>

    </form>

    <!-- Social Login -->

    <div class="social-login">

        <p>or continue with</p>

        <div class="social-buttons">

            <button
                type="button"
                class="social-btn google">

                <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
                alt="Google">

                Google

            </button>

            <button
                type="button"
                class="social-btn apple">

                <i class="fa-brands fa-apple"></i>

                Apple

            </button>

        </div>

    </div>

    <!-- Bottom Text -->

    <div class="bottom-text">

        Don't have an account?

        <a href="#" id="createBtn">

            Create Account

        </a>

    </div>

</div>
<!-- ===========================
      CREATE ACCOUNT CARD
=========================== -->

<div class="signup-card" id="signupCard">

    <!-- Logo -->

    <div class="logo">

        <h1>BUJJI</h1>

        <h2>TUNES</h2>

        <p>Create Your Account</p>

    </div>

    <!-- Full Name -->

    <div class="input-box">

        <i class="fa-solid fa-user icon"></i>

        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required>

    </div>

    <!-- Email -->

    <div class="input-box">

        <i class="fa-solid fa-envelope icon"></i>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

    </div>

    <!-- Password -->

    <div class="input-box">

        <i class="fa-solid fa-lock icon"></i>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create Password"
            required>

        <i
            class="fa-solid fa-eye eye"
            id="signupShowPass"></i>

    </div>

    <!-- Create Account Button -->

    <button
        type="button"
        class="create-account-btn"
        id="signupBtn">

        CREATE ACCOUNT

    </button>

    <!-- Bottom Text -->

    <div class="bottom-text">

        Already have an account?

        <a href="#" id="backLogin">

            Login

        </a>

    </div>

</div>

<!-- ===========================
      TRANSITION EFFECTS
=========================== -->

<div id="butterfly-container"></div>

<div id="screenFade"></div>

<!-- ===========================
      JAVASCRIPT
=========================== -->

<script src="script.js"></script>

</body>
</html>
